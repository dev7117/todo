name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Public repository: @claude only when the comment or issue author
    # association is OWNER, MEMBER, or COLLABORATOR.
    # allowed_non_write_users stays unset (the action's write-access default).
    # No pull_request_target. No tool allowlist: nothing whose purpose is
    # printing the environment or reading secrets is enabled.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # The default GitHub App path exchanges this job's OIDC token for an
      # installation token. docs/setup.md requires id-token: write for that
      # path. CLAUDE_CODE_OAUTH_TOKEN authenticates the Claude API only.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The model input is deprecated. Pass the model through claude_args.
          # docs/configuration.md documents Claude Opus 5 as claude-opus-5.
          # It does not document a separate Opus 5.5 id. The [1m] suffix is a
          # context-window selector for API gateways, not the model id.
          # Write access stays the action default: allowed_non_write_users is unset.
          claude_args: |
            --model claude-opus-5-5
